name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: note_taking_app
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Vitest (unit)
        run: npx vitest run --config vitest.config.js

      - name: Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Playwright (e2e)
        run: npx playwright test --config playwright.config.js

      - name: Build
        run: npm run build

